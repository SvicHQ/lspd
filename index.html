<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO - Log Helper</title>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">

        <h1>LEO - Log Helper</h1>

        <form id="main_form">

            <input type="text" id="suspect_name" placeholder="Suspect Name" required>

            <input type="text" id="license_plate" placeholder="License Plate" style="text-transform: uppercase;">

            <div id="penalties"></div>

            <div class="btn-row">
                <button type="button" class="flex1" id="add_btn">🧩 Add Penalty</button>
                <button type="button" class="flex1" id="clear_btn">🧹 Clear</button>
            </div>

            <div class="total-box">
                Total Fine: $<span id="total">0</span>
            </div>

            <button type="submit">🔄 Submit</button>

        </form>

        <div id="output" class="output-box"></div>

        <div class="btn-row">
            <button class="flex1" id="copy_btn">📑 Copy</button>
            <button class="flex1" id="send_to_discord">📨 Send to Discord</button>
        </div>

        <p class="credit">
            Developed by <a href="https://bishalqx980.github.io/bishalqx980/">bishalqx980</a>
        </p>

    </div>

    <script src="./script.js"></script>
    <script src="./discord.js"></script>

</body>
</html>
